plugins { id 'com.android.application' }

def ksPath = System.getenv('METABLOOMS_R22_KEYSTORE')
def ksPass = System.getenv('METABLOOMS_R22_KEYSTORE_PASSWORD')
if (!ksPath || !ksPass) { throw new GradleException('R22 signing identity environment is required') }

android {
    namespace 'com.metablooms.toddlersounds'
    compileSdk 36

    defaultConfig {
        applicationId 'com.metablooms.toddlersounds'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.3.0'
    }

    signingConfigs {
        release {
            storeFile file(ksPath)
            storePassword ksPass
            keyAlias 'toddler-sounds'
            keyPassword ksPass
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'androidx.core:core:1.16.0'
}
