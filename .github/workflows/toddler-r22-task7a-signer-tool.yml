name: Toddler R22 Task7A Signer Tool
on:
  pull_request:
    paths:
      - '.github/workflows/toddler-r22-task7a-signer-tool.yml'
permissions:
  contents: read
jobs:
  signer-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify signer
        run: |
          set -euo pipefail
          URL='https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar'
          OUT="$RUNNER_TEMP/uber-apk-signer-1.3.0.jar"
          curl -fL --retry 4 --retry-delay 2 "$URL" -o "$OUT"
          echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  '"$OUT" | sha256sum -c -
          jarsigner -verify "$OUT"
          java -jar "$OUT" --help >/dev/null
          cp "$OUT" "$RUNNER_TEMP/uber-apk-signer.jar"
          sha256sum "$RUNNER_TEMP/uber-apk-signer.jar" > "$RUNNER_TEMP/uber-apk-signer.jar.sha256"
      - name: Upload verified signer
        uses: actions/upload-artifact@v4
        with:
          name: verified-uber-apk-signer-1.3.0
          path: |
            ${{ runner.temp }}/uber-apk-signer.jar
            ${{ runner.temp }}/uber-apk-signer.jar.sha256
          if-no-files-found: error
          retention-days: 1
