name: Toddler R22 Task7A Safe Mode Build
on:
  pull_request:
    paths:
      - 'ci/toddler-r22-task7a-safe-mode/**'
      - '.github/workflows/toddler-r22-task7a-safe-mode.yml'
permissions:
  contents: read
jobs:
  safe-mode-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore exact safe-mode fixture
        run: |
          set -euo pipefail
          base64 -d ci/toddler-r22-task7a-safe-mode/project.tar.gz.b64 > "$RUNNER_TEMP/project.tar.gz"
          tar -xzf "$RUNNER_TEMP/project.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ci_project"
          sha256sum -c SOURCE_HASHES.txt
          ! grep -R 'startLockTask()' app/src/main/java
      - name: Install Android API 36
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Download verified Gradle 8.13
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 'https://services.gradle.org/distributions/gradle-8.13-bin.zip' -o "$RUNNER_TEMP/gradle-8.13-bin.zip"
          echo '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  '"$RUNNER_TEMP/gradle-8.13-bin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
      - name: Generate temporary CI signing identity
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/r22-ci.jks" -storepass ci-password -keypass ci-password -alias toddler-sounds -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=MetaBlooms Safe Mode CI,O=MetaBlooms,C=US'
      - name: Compile safe-mode native shell
        env:
          METABLOOMS_R22_KEYSTORE: ${{ runner.temp }}/r22-ci.jks
          METABLOOMS_R22_KEYSTORE_PASSWORD: ci-password
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ci_project"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon --stacktrace :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$RUNNER_TEMP/ToddlerSounds_R22_SAFE_MODE_NATIVE_SHELL.apk"
          sha256sum "$RUNNER_TEMP/ToddlerSounds_R22_SAFE_MODE_NATIVE_SHELL.apk" > "$RUNNER_TEMP/ToddlerSounds_R22_SAFE_MODE_NATIVE_SHELL.apk.sha256"
      - name: Upload safe-mode native shell
        uses: actions/upload-artifact@v4
        with:
          name: ToddlerSounds-R22-Safe-Mode-Native-Shell
          path: |
            ${{ runner.temp }}/ToddlerSounds_R22_SAFE_MODE_NATIVE_SHELL.apk
            ${{ runner.temp }}/ToddlerSounds_R22_SAFE_MODE_NATIVE_SHELL.apk.sha256
          if-no-files-found: error
          retention-days: 1
