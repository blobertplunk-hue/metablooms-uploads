name: Toddler R22 Task6 Play Build Smoke
on:
  pull_request:
    paths:
      - 'ci/toddler-r22-task6/**'
      - '.github/workflows/toddler-r22-task6-play-smoke.yml'
permissions:
  contents: read
jobs:
  play-build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore exact compile fixture
        run: |
          set -euo pipefail
          base64 -d ci/toddler-r22-task6/project.tar.gz.b64 > "$RUNNER_TEMP/project.tar.gz"
          tar -xzf "$RUNNER_TEMP/project.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/project"
          sha256sum -c SOURCE_HASHES.txt
      - name: Install Android API 36
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Download verified Gradle 8.13
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 'https://services.gradle.org/distributions/gradle-8.13-bin.zip' -o "$RUNNER_TEMP/gradle-8.13-bin.zip"
          echo '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  '"$RUNNER_TEMP/gradle-8.13-bin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
      - name: Generate temporary signing identity
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/r22-ci.jks" -storepass ci-password -keypass ci-password -alias toddler-sounds -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=MetaBlooms CI,O=MetaBlooms,C=US'
      - name: Compile Billing 9.1 AAB and APK
        env:
          METABLOOMS_R22_KEYSTORE: ${{ runner.temp }}/r22-ci.jks
          METABLOOMS_R22_KEYSTORE_PASSWORD: ci-password
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/project"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon --stacktrace :app:bundleRelease :app:assembleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$AAB"
          test -s "$APK"
          unzip -t "$AAB"
          unzip -t "$APK"
          jarsigner -verify "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$AAB" "$APK"
          echo PASS_TASK6_PLAY_BILLING_AAB_APK_COMPILE_SMOKE
